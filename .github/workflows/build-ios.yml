name: Build Cry of Fear for iOS-arm64

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout iOS SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: ios-sdks-repo

      - name: Setup iOS cross-compiler toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld xz-utils
          sudo mkdir -p /opt/ios-sdk
          SDK_ARCHIVE=$(find ios-sdks-repo -name "iPhoneOS*.tar.*" | sort -V | tail -n 1)
          if [ -n "$SDK_ARCHIVE" ]; then
            sudo tar -xf "$SDK_ARCHIVE" -C /opt/ios-sdk --strip-components=1
          else
            SDK_DIR=$(find ios-sdks-repo -maxdepth 2 -type d -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
            sudo cp -a "$SDK_DIR/." /opt/ios-sdk/
          fi

      - name: Configure and build CoF dylibs for iOS arm64
        run: |
          cat << 'EOF' > ios-toolchain.cmake
          set(CMAKE_SYSTEM_NAME iOS)
          set(CMAKE_SYSTEM_PROCESSOR arm64)
          set(CMAKE_OSX_ARCHITECTURES arm64)
          set(CMAKE_OSX_SYSROOT /opt/ios-sdk)
          set(CMAKE_OSX_DEPLOYMENT_TARGET 13.0)
          set(CMAKE_C_COMPILER clang)
          set(CMAKE_CXX_COMPILER clang++)
          set(CMAKE_C_FLAGS_INIT "-target arm64-apple-ios13.0 -isysroot /opt/ios-sdk")
          set(CMAKE_CXX_FLAGS_INIT "-target arm64-apple-ios13.0 -isysroot /opt/ios-sdk")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-fuse-ld=lld -L/opt/ios-sdk/usr/lib")
          set(CMAKE_SHARED_LINKER_FLAGS_INIT "-fuse-ld=lld -L/opt/ios-sdk/usr/lib")
          set(CMAKE_FIND_ROOT_PATH /opt/ios-sdk)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

          cmake -S src/cof -B build/cof-ios -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/ios-toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -D64BIT=ON \
            -DGAMEDIR=cryoffear \
            -DCMAKE_INSTALL_PREFIX="$PWD/out/ios" \
            -DSERVER_INSTALL_DIR=cl_dlls \
            -DCLIENT_INSTALL_DIR=cl_dlls \
            -DUSE_VGUI=OFF \
            -DUSE_NOVGUI_MOTD=ON \
            -DUSE_NOVGUI_SCOREBOARD=ON
          cmake --build build/cof-ios --target install

      - name: Upload iOS arm64 dylibs
        uses: actions/upload-artifact@v4
        with:
          name: cryoffear-ios-arm64-dylibs
          path: out/ios/cryoffear/cl_dlls/
